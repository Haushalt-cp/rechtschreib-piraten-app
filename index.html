function diffMarken(ist, soll){
  const m=ist.length, n=soll.length, L=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--) for(let j=n-1;j>=0;j--) L[i][j]= ist[i]===soll[j] ? L[i+1][j+1]+1 : Math.max(L[i+1][j],L[i][j+1]);
  const istOk=new Array(m).fill(false), sollOk=new Array(n).fill(false);
  let i=0,j=0; while(i<m&&j<n){ if(ist[i]===soll[j]){ istOk[i]=sollOk[j]=true; i++; j++; } else if(L[i+1][j]>=L[i][j+1]) i++; else j++; }
  return {istOk, sollOk};
}

function pruefeLuecke(eingabe, loes, wi){
  const e = eingabe.replace(/\s+/g,' ').trim().replace(/[.,!?;:]+$/,'').trim();
  if(e===loes) return 'richtig';
  if(e.toLowerCase()===loes.toLowerCase()) return wi===0 ? 'satzanfang' : 'grossklein';
  return 'schreibweise';
}

/* Ganzen Satz prüfen: Wort für Wort zuordnen */
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++){ c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); } p=c; }
  return p[n];
}
function vergleicheSatz(eingabe, s){
  const it = tok(eingabe);
  const I = it.filter(t=>!ZEICHEN.test(t)), W = s.words;
  const n=W.length, m=I.length;
  const kosten=(a,b)=> a===b?0 : a.toLowerCase()===b.toLowerCase()?0.1 :
      lev(a.toLowerCase(),b.toLowerCase()) <= Math.max(1,Math.floor(a.length/3)) ? 0.7 : 2.5;
  const D=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=0;i<=n;i++) D[i][0]=i; for(let j=0;j<=m;j++) D[0][j]=j;
  for(let i=1;i<=n;i++) for(let j=1;j<=m;j++)
    D[i][j]=Math.min(D[i-1][j]+1, D[i][j-1]+1, D[i-1][j-1]+kosten(W[i-1],I[j-1]));
  const woerter=new Array(n), zuviel=[]; let i=n,j=m;
  while(i>0||j>0){
    if(i>0&&j>0 && Math.abs(D[i][j]-(D[i-1][j-1]+kosten(W[i-1],I[j-1])))<1e-9){
      const soll=W[i-1], ist=I[j-1];
      let art = soll===ist ? 'richtig' : soll.toLowerCase()===ist.toLowerCase() ? (i-1===0 && !s.klein?'satzanfang':'grossklein') : 'schreibweise';
      woerter[i-1]={soll,ist,art}; i--; j--;
    } else if(i>0 && Math.abs(D[i][j]-(D[i-1][j]+1))<1e-9){ woerter[i-1]={soll:W[i-1],ist:'',art:'fehlt'}; i--; }
    else { zuviel.unshift(I[j-1]); j--; }
  }
  const letztes = it.length ? it[it.length-1] : '';
  const endeIst = ZEICHEN.test(letztes) ? letztes : '';
  return { woerter, zuviel, endeSoll:s.ende, endeIst, endeOk: s.ende===endeIst };
}

/* Schatzkiste */
function kisteFalsch(S, key, wort, art, heute, sid){
  const k = S.kiste[key];
  if(k && k.status==='kiste'){ k.zaehler=0; k.tage=[]; k.letzte=heute; k.lastSid=sid; k.fehler=(k.fehler||0)+1; return {warSchatz:true}; }
  if(k && k.status==='geknackt'){ Object.assign(k,{status:'kiste',zaehler:0,tage:[],art,letzte:heute,lastSid:sid,fehler:(k.fehler||0)+1}); return {warSchatz:true}; }
  S.kiste[key] = {wort, art, status:'kiste', zaehler:0, sterne:0, tage:[], seit:heute, letzte:heute, lastSid:sid, heute:{d:'',n:0}, fehler:1};
  return {warSchatz:false};
}
function kisteRichtig(S, key, heute, sid){
  const k=S.kiste[key]; if(!k || k.status!=='kiste') return null;
  const E=S.einst;
  k.zaehler++; if(!k.tage.includes(heute)) k.tage.push(heute);
  k.sterne = Math.min(E.schwelle, Math.max(k.sterne||0, k.zaehler));
  k.letzte=heute; k.lastSid=sid;
  if(k.zaehler>=E.schwelle && k.tage.length>=E.minTage){ k.status='geknackt'; k.geknacktAm=heute; return {geknackt:true, wort:k.wort}; }
  return {geknackt:false, wort:k.wort, noch: Math.max(0,E.schwelle-k.zaehler)};
}
function faelligeSchatzwoerter(S, heute){
  const E=S.einst;
  return Object.entries(S.kiste)
    .filter(([k,v])=> v.status==='kiste' && !(v.heute && v.heute.d===heute && v.heute.n>=E.maxProTag))
    .sort((x,y)=> (x[1].letzte||'').localeCompare(y[1].letzte||'') || x[1].zaehler-y[1].zaehler)
    .map(([k])=>k);
}
/* passenden anderen Satz für ein Wort suchen (nie am Satzanfang).
   sperre(s) = true: Satz möglichst nicht nehmen (Hauptsätze noch nicht geschaffter Abenteuer) */
function satzFuerWort(S, wort, lastSid, ausschliessen, sperre, ins){
  const kand=[];
  SAETZE.forEach(s=>{ if(ins && s.ins!==ins) return; s.words.forEach((w,wi)=>{ if(wi>0 && w===wort) kand.push({sid:s.id,wi}); }); });
  if(!kand.length) return null;
  const zuletzt = c => (S.gesehen[c.sid]||{}).t||0;
  const frei = c => !(sperre && sperre(SATZ[c.sid]));
  const stufen = [
    kand.filter(c=> frei(c) && c.sid!==lastSid && !ausschliessen.has(c.sid) && !zuletzt(c)),  // noch nie gesehen
    kand.filter(c=> frei(c) && c.sid!==lastSid && !ausschliessen.has(c.sid)),
    kand.filter(c=> c.sid!==lastSid && !ausschliessen.has(c.sid)),
    kand.filter(c=> c.sid!==lastSid),
    kand ];
  const gut = stufen.find(x=>x.length).slice().sort((x,y)=> zuletzt(x)-zuletzt(y) || Math.random()-.5);
  const top = gut.slice(0, Math.min(2,gut.length));
  return top[Math.floor(Math.random()*top.length)];
}
function satzFuerSchatz(S, key, ausschliessen, sperre, ins){
  const k=S.kiste[key]; if(!k) return null;
  return satzFuerWort(S, k.wort, k.lastSid, ausschliessen, sperre, ins);
}
function abKey(n, ins){ ins=ins||INSEL.id; return ins==='tier' ? n : ins+n; }
function sperreFuer(S, a){ return s => !s.zusatz && !(s.ins===INSEL.id && s.a===a) && !(((S.ab||{})[abKey(s.a,s.ins)]||{}).erfuellt); }
/* schon geübte Wörter, die wiederkommen sollen – auch wenn sie richtig waren.
   Abwechselnd: ein selten geübtes Wort und eines, das am längsten nicht mehr dran war. */
function wiederholWoerter(S, ohne, anzahl){
  const kand = Object.entries(S.wl||{}).filter(([k,v])=> !ohne.has(k) && !(S.kiste[k] && S.kiste[k].status==='kiste'));
  const wenig = mischen(kand).sort((x,y)=> x[1].n-y[1].n).slice(0,3);
  const alt = kand.slice().sort((x,y)=> (x[1].t||0)-(y[1].t||0)).slice(0,3);
  const wahl=[]; const nimm=l=>{ const c=mischen(l).find(x=>!wahl.includes(x)); if(c) wahl.push(c); };
  for(let i=0;i<anzahl;i++) nimm(i%2===0 ? wenig : alt);
  return wahl.map(([k,v])=>({key:k, wort:v.wort}));
}
/* Level je Aufgabe festlegen (Eltern-Einstellung) */
/* Level 2 sanft beginnen: so viele ganze Sätze hat das Kind schon geschrieben */
function satzZahl(S){ return (S.versuche||[]).filter(v=>v.form==='satz').length; }
/* höchstens so viele Wörter pro ganzem Satz: zuerst kurz, dann länger */
function satzMaxWoerter(S){ const n=satzZahl(S); return n<10 ? 4 : n<30 ? 5 : 99; }
/* «leicht» = keine schwierigen Stellen (qu, ck, tz, ie, ä/ö/ü, ß, v, pf, doppelte Mitlaute, Dehnungs-h, sp/st am Anfang …);
   häufige kleine Wörter (die, sehr, viel, hier …) zählen nicht als schwierig. Gilt für die ersten 30 ganzen Sätze. */
var LEICHT_HAEUFIG_ = new Set('der die das den dem des ein eine einen einem einer ist sind hat haben und im in auf mit zu am an es er sie wir ich du ihr mein meine meinen dein deine sehr ganz nicht kann will viel viele hier wie wo so auch noch vom zum zur sein seine ihre ins aus bei nach von vor unter über'.split(' '));
const SCHWER_RX = /qu|ck|tz|ie|ä|ö|ü|ß|v|ph|th|chs|pf|x|y|([bdfglmnprstk])\1|[aeiou]h|^sp|^st|c(?!h)/i;
function satzLeicht(s){ return s.words.every(w=>LEICHT_HAEUFIG.has(w.toLowerCase()) || !SCHWER_RX.test(w)); }
function formenSetzen(S, liste){
  liste.forEach(t=>{ if(!t.fertig){ const x=SATZ[t.sid]; t.form = (x && INSELN[x.ins] && INSELN[x.ins].art==='satz') ? 'satz' : 'luecke'; } });
  return liste;
}
/* Schatzkisten-Runde: nur Wörter aus der Schatzkiste, jedes bis 2× in verschiedenen Sätzen */
function baueKisteRunde(S, heute){
  const keys = Object.entries(S.kiste).filter(([k,v])=>v.status==='kiste').map(([k])=>k);
  const aus = new Set(), liste=[];
  for(let pass=0; pass<2 && liste.length<KISTE_MAX; pass++){
    mischen(keys).forEach(key=>{
      if(liste.length>=KISTE_MAX) return;
      const c = satzFuerSchatz(S, key, aus); if(!c) return;
      aus.add(c.sid); liste.push({sid:c.sid, wi:c.wi, schatz:true, key});
    });
  }
  return formenSetzen(S, liste);
}
/* eine Runde zusammenstellen */
function baueRunde(S, a, r, heute, wiederholung, bereitsImDurchgang){
  const imDurchgang = new Set(bereitsImDurchgang);
  const haupt = SAETZE.filter(s=>!s.zusatz && s.ins===INSEL.id && s.a===a && s.r===r);
  const ganz = INSEL.art==='satz';
  let normal;
  if(!wiederholung || ganz){
    normal = haupt;
  } else {
    // gleiche Wörter wie die Runde, aber jeweils der am längsten nicht gesehene Satz dazu
    const gewaehlt = new Set();
    normal = haupt.map(h=>{
      const kand = SAETZE.filter(s=> s.loes===h.loes && s.gap>0 && !imDurchgang.has(s.id) && !gewaehlt.has(s.id));
      if(!kand.length) return h;
      kand.sort((x,y)=> ((S.gesehen[x.id]||{}).t||0) - ((S.gesehen[y.id]||{}).t||0) || Math.random()-.5);
      gewaehlt.add(kand[0].id); return kand[0];
    });
    normal = mischen(normal);
  }
  if(wiederholung && ganz) normal = mischen(haupt);
  const aufgaben = normal.map(s=>({sid:s.id, wi:s.gap, schatz:false, key:s.fid}));
  const aus = new Set([...aufgaben.map(t=>t.sid), ...imDurchgang]);
  // im ersten Durchgang: Sätze der späteren Runden nicht vorwegnehmen
  if(!wiederholung) SAETZE.forEach(s=>{ if(!s.zusatz && s.ins===INSEL.id && s.a===a && s.r>r) aus.add(s.id); });
  const sperre = sperreFuer(S, a);
  const EXTRA = RUNDE_AUFGABEN - aufgaben.length;   // meist 2
  const extras = [];
  // 1. Schatzwörter (höchstens so viele, wie Platz ist)
  const faellig = faelligeSchatzwoerter(S, heute).slice(0, Math.min(S.einst.schatzProRunde, EXTRA));
  faellig.forEach(key=>{
    if(extras.length>=EXTRA) return;
    const c = satzFuerSchatz(S, key, aus, sperre, INSEL.id);
    if(!c) return;
    aus.add(c.sid);
    extras.push({sid:c.sid, wi:c.wi, schatz:true, key});
    const v=S.kiste[key]; if(!v.heute || v.heute.d!==heute) v.heute={d:heute,n:0}; v.heute.n++;
  });
  // 2. schon geübte Wörter (auch richtige), gern aus anderen Abenteuern
  if(extras.length<EXTRA){
    const ohne = new Set([...aufgaben.map(t=>t.key), ...faellig]);
    wiederholWoerter(S, ohne, EXTRA-extras.length).forEach(w=>{
      if(extras.length>=EXTRA) return;
      const c = satzFuerWort(S, w.wort, ((S.wl||{})[w.key]||{}).sid, aus, sperre, INSEL.id);
      if(!c) return;
      aus.add(c.sid);
      extras.push({sid:c.sid, wi:c.wi, schatz:false, wdh:true, key:w.key});
    });
  }
  // 3. sonst ein anderer Satz zu einem Wort dieses Abenteuers (z. B. in Runde 1)
  if(extras.length<EXTRA){
    const passt = s => s.ins===INSEL.id && (ganz || s.gap>0) && !aus.has(s.id);
    const pool = mischen(SAETZE.filter(s=> passt(s) && (s.zusatz ? s.a===a : (s.a<a || (s.a===a && s.r<r)))));
    const pool2 = mischen(SAETZE.filter(s=> passt(s) && s.zusatz && s.a<=a));
    for(const s of [...pool, ...pool2]){ if(extras.length>=EXTRA) break; if(aus.has(s.id)) continue; aus.add(s.id); extras.push({sid:s.id, wi:s.gap, schatz:false, wdh:true, key:s.fid}); }
  }
  // Schatzwort/Extra am Anfang (2. Aufgabe) und in der Mitte (8. Aufgabe)
  return formenSetzen(S, [...aufgaben.slice(0,1), ...extras.slice(0,1), ...aufgaben.slice(1,6), ...extras.slice(1), ...aufgaben.slice(6)]);
}

function muenzenFuerErgebnis(E, richtig, gesamt){
  const q = gesamt ? richtig*100/gesamt : 0;
  const stufen = String(E.belohnung).split(',').map(x=>x.split(':').map(Number)).filter(x=>x.length===2&&!isNaN(x[0])&&!isNaN(x[1])).sort((a,b)=>b[0]-a[0]);
  const st = stufen.find(x=> q >= x[0]);
  return st ? st[1] : 0;
}

   möglichst eine Aufnahme; fehlt eine, spricht das Tablet nur dieses Stück (Rückfall).

function sprachTeile(text){
  return (String(text).replace(/\s+/g,' ').trim().match(/[^.!?:]+[.!?:]*/g)||[]).map(x=>x.trim()).filter(x=>x && !/^[.!?:]+$/.test(x));
}
function tonKey(t){ return String(t).replace(/\s+/g,' ').trim().replace(/[.!?:]+$/,'').trim().toLowerCase(); }
function reEsc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function ohneName(t){
  if(!S || !S.name) return t;
  return t.replace(new RegExp('\\s*,?\\s*'+reEsc(S.name)+'(?![A-Za-zÄÖÜäöüß])','g'),'').replace(/\s+([,.!?])/g,'$1');
}
const TON = { index:null, laden:null, pakete:{}, puffer:new Map(), fehlt:false, lauf:0, quelle:null };
function tonIndexLaden(){
  if(!TON.laden) TON.laden = fetch('audio/index.json').then(r=>{ if(!r.ok) throw 0; return r.json(); })
    .then(j=>{ TON.index=j; setTimeout(tonVorladen, 1500); return j; })
    .catch(()=>{ TON.fehlt=true; return null; });
  return TON.laden;
}
function tonPaket(nr){
  if(!TON.pakete[nr]) TON.pakete[nr] = fetch('audio/p'+String(nr).padStart(2,'0')+'.json').then(r=>r.json()).catch(()=>{ delete TON.pakete[nr]; return {}; });
  return TON.pakete[nr];
}
/* alle Pakete nach und nach im Hintergrund holen, damit später nichts wartet */
async function tonVorladen(){
  if(!TON.index) return;

  for(let i=0;i<n;i++){ try{ await tonPaket(i); }catch(e){} }

function ctx(){

}

    try{ if(ac.state==='suspended') ac.resume(); }catch(e){}
    const q=ac.createBufferSource(); q.buffer=ab; q.connect(ac.destination);

function geraetStueck(t, lauf){

      u.rate=((S&&S.einst.tempo)||90)/100; u.onstart=()=>{ tonLetzterStart=Date.now(); }; u.onend=u.onerror=()=>ok();

const TON_AUFNAHMEN=false;   // fest aufgenommene Stimme (14.11.2026 getestet, auf den Tablets nicht praktikabel)
function sag(...teile){
  if(!TON_AUFNAHMEN) return geraeteSag(...teile);
  teile = teile.filter(Boolean).map(t=>typeof t==='object'?t.froh:t).filter(Boolean);
  if(!teile.length) return;
  sagStop(); const lauf=TON.lauf;
  const stuecke = [].concat(...teile.map(sprachTeile));
  (async()=>{
    await tonIndexLaden();
    if(TON.fehlt){ if(lauf===TON.lauf) geraeteSag(...teile); return; }
    // alle Aufnahmen vorbereiten (parallel), dann der Reihe nach abspielen
    const plan = stuecke.map(t=>{
      let k=tonKey(t); if(!(k in TON.index)){ const k2=tonKey(ohneName(t)); if(k2 in TON.index) k=k2; else k=null; }
      return {t, k, p: k ? tonPuffer(k) : null};
    });
    for(const x of plan){
      if(lauf!==TON.lauf) return;
      const ab = x.p ? await x.p : null;
      if(lauf!==TON.lauf) return;
      if(ab) await spielePuffer(ab, lauf);
      else { fehlendMerken(x.t); await geraetStueck(x.t, lauf); }
    }
  })();
}

let segelt=false;
function segeln(schiff, ziel, fertig){
  if(segelt) return;
  let ruhig=false; try{ ruhig=matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
  if(!schiff || !ziel || ruhig) return fertig();
  segelt=true;

  const dx=(b.left+b.width/2)-(a.left+a.width/2), dy=(b.top+b.height*0.6)-(a.top+a.height/2);

  const k=schiff.cloneNode(true);
  k.style.cssText=`position:fixed;left:${a.left}px;top:${a.top}px;width:${a.width}px;height:${a.height}px;margin:0;z-index:50;animation:none;pointer-events:none;transform:${dreh||'none'}`;

  k.style.transition='transform 1.4s cubic-bezier(.45,.05,.4,1)';

};
function kurve(p0,p1,p2,p3){
  const r=v=>Math.round(v*10)/10;
  const c1=[r(p1[0]+(p2[0]-p0[0])/6), r(p1[1]+(p2[1]-p0[1])/6)], c2=[r(p2[0]-(p3[0]-p1[0])/6), r(p2[1]-(p3[1]-p1[1])/6)];
  return `M${p1} C${c1} ${c2} ${p2}`;
}
/* Inselform (wird auf die Kartengrösse gestreckt) */
const INSEL_FORM='M12 40 C8 22 26 8 44 10 C58 4 78 6 88 18 C98 30 96 50 92 64 C90 80 76 92 58 92 C42 96 22 92 14 80 C6 70 8 54 12 40 Z';
function landSVG(){

}
function insel(){
  const hoch = window.innerHeight > window.innerWidth, W = hoch ? WEG.hoch : WEG.quer;
  const pkt = [...W.st, W.x];

  let jetzt = stand.findIndex(x=>x.lauf);
  if(jetzt<0) jetzt = stand.findIndex(x=>x.o && !x.a.erfuellt);
  const alleFertig = stand.every(x=>x.a.erfuellt);
  const heldPos = jetzt>=0 ? W.st[jetzt] : W.x;
  // Weg in Abschnitten: Abschnitt i führt von Abenteuer i zum nächsten (zuletzt zum X); geschafft = gold
  const segs = pkt.slice(0,-1).map((p,i)=>({d:kurve(pkt[i-1]||p, p, pkt[i+1], pkt[i+2]||pkt[i+1]), fertig:stand[i].a.erfuellt}));
  const svg = `<svg class="weg" viewBox="0 0 100 100" preserveAspectRatio="none">
     ${segs.map(s=>`<path d="${s.d}" class="weg-grund"/>`).join('')}
     ${segs.filter(s=>s.fertig).map(s=>`<path d="${s.d}" class="weg-fertig"/>`).join('')}
     ${segs.map(s=>`<path d="${s.d}" class="weg-tritte"/>`).join('')}</svg>`;
  const pos = p => `left:${p[0]}%;top:${p[1]}%`;
  const steine = stand.map((x,i)=>{
    const {n,a,o,lauf}=x;

    const cls = a.erfuellt ? 'fertig' : !o ? 'zu' : '';
    return `<button class="stein ${cls} ${i===jetzt?'jetzt':''}" style="${pos(W.st[i])}" data-ab="${n}" ${o?'':'disabled'}>
      <div class="stein-rund">${ABENTEUER_BILD[i]}<span class="stein-nr">${a.erfuellt?'⭐':o?n:'🔒'}</span></div>
      <div class="stein-name">${esc(ABENTEUER[i])}</div>${info?`<div class="stein-info">${info}</div>`:''}</button>`;
  }).join('');
  const gruss = `Ahoi, ${anrede(S.figur)} ${S.name}!`;
  app.innerHTML = `${kopf((INSEL.id==='tier'?'🌴 ':INSEL.bild+' ')+INSEL.name,'karte')}
    <div class="insel-oben">${aku(gruss,'sprich')}<button class="knopf" data-go="karte">🗺️ Zurück zur Schatzkarte</button></div>
    <div class="inselkarte ${hoch?'hoch':''}" style="margin-top:12px">
      ${landSVG()}
      ${W.deko.map(([e,x,y])=>`<span class="deko" style="left:${x}%;top:${y}%">${e}</span>`).join('')}
      ${svg}
      <div class="anleger" style="${pos(W.schiff)}">${schiffSVG(S.figur)}</div>
      <div class="ziel-truhe" style="${pos(W.x)}">${truheSVG(alleFertig)}${(S.inselSchatz||{})[INSEL.id]&&INSEL_SCHATZ[INSEL.id]?`<span class="ziel-schatz gold-emoji">${INSEL_SCHATZ[INSEL.id].bild}</span>`:''}<span class="x">❌</span></div>
      ${steine}
      <div class="held" style="${pos(heldPos)}">${figurSVG(S.figur)}</div>
    </div>
    ${parm.wahl ? rundenWahlHTML(parm.wahl) : ''}`;
  app.querySelectorAll('[data-ab]').forEach(b=>b.onclick=()=>{
    const n=+b.dataset.ab, a=abStand(n);
    if(laufVon(n) || (!a.runden && !a.erfuellt)) return starteAbenteuer(n);   // angefangen oder ganz neu: direkt los
    zeige('insel',{wahl:n}); sag('Wo willst du weitermachen?');
  });
  if(parm.wahl){
    const n=parm.wahl;
    app.querySelectorAll('[data-weiter]').forEach(b=>b.onclick=()=>starteAbenteuer(n));
    app.querySelectorAll('[data-neu]').forEach(b=>b.onclick=()=>{ verwerfeLauf(laufVon(n)); starteAbenteuer(n); });
    app.querySelectorAll('[data-ueb]').forEach(b=>b.onclick=()=>starteUebung(n, +b.dataset.ueb));
    app.querySelectorAll('[data-schliessen]').forEach(b=>b.onclick=()=>zeige('insel'));
  }
}
/* Auswahl: beim aktuellen Stand weitermachen oder eine frühere Runde nochmals spielen */
function rundenWahlHTML(n){
  const a=abStand(n), lauf=laufVon(n);
  const aktuell = lauf ? lauf.r : (a.erfuellt ? 0 : a.runden+1);
  let b='';
  if(a.erfuellt) b += `<button class="knopf gruen" data-weiter="1">▶ ${lauf?`Weiter mit Runde ${lauf.r}<br><small>Aufgabe ${Math.min(lauf.i+1,lauf.aufgaben.length)} von ${lauf.aufgaben.length}</small>`:'Ganzes Abenteuer nochmals'}</button>`;
  for(let r=1;r<=4;r++){
    if(a.erfuellt || r<aktuell) b+=`<button class="knopf" data-ueb="${r}">⭐ Runde ${r} nochmals üben</button>`;
    else if(r===aktuell) b+= lauf
      ? `<button class="knopf gruen" data-weiter="1">▶ Weiter mit Runde ${r}<br><small>Aufgabe ${Math.min(lauf.i+1,lauf.aufgaben.length)} von ${lauf.aufgaben.length}</small></button>`
      : `<button class="knopf gruen" data-weiter="1">▶ Runde ${r} spielen</button>`;
    else b+=`<button class="knopf" disabled>🔒 Runde ${r}</button>`;
  }
  return `<div class="dialog-hg"><div class="dialog blatt">
    <h2>${ABENTEUER_BILD[n-1]} ${esc(ABENTEUER[n-1])}</h2>${aku('Wo willst du weitermachen?','sprich')}
    <div class="wahl-liste">${b}</div><button class="knopf klein" data-schliessen="1">✕ Schliessen</button></div></div>`;
}
/* Runde verwerfen: zählt nicht, Sätze werden wieder frei */
function verwerfeLauf(L){
  if(!L) return;
  if(!L.kiste && !L.uebung){
    const a=abStand(L.a, L.ins||'tier'); a.punkte=a.punkte||{richtig:0,gesamt:0};
    a.punkte.richtig=Math.max(0,a.punkte.richtig-(L.richtig||0)); a.punkte.gesamt=Math.max(0,a.punkte.gesamt-(L.gesamt||0));
    const ids=new Set(L.aufgaben.map(t=>t.sid)); a.saetze=(a.saetze||[]).filter(x=>!ids.has(x));
  }
  if(L.kiste && !(L.gesamt) && S.kisteTag && S.kisteTag.n>0) S.kisteTag.n--;
  if(S.lauf===L) S.lauf=null;
  Object.keys(S.laeufe||{}).forEach(k=>{ if(S.laeufe[k]===L) delete S.laeufe[k]; });
  speichern();
}
/* Eine schon gespielte Runde nochmals üben (Fortschritt bleibt, halbe Münzen) */
function starteUebung(n, r){
  S.laeufe=S.laeufe||{};
  if(S.lauf){ if(S.lauf.uebung) S.lauf=null; else { S.laeufe[S.lauf.kiste?0:laufKey(S.lauf)]=S.lauf; S.lauf=null; } }
  const aufgaben=baueRunde(S, n, r, heute(), true, []);
  S.lauf={a:n, ins:INSEL.id, r, uebung:true, aufgaben, i:0, normal:0, richtig:0, gesamt:0, fb:null, ansage:TEXTE.losGehts};
  speichern(); zeige('spiel'); vorlesenAufgabe(true);
}
/* Abbrechen mitten in einer Runde: weiterspielen oder Runde verwerfen */
function abbruchFrage(){
  if(app.querySelector('.dialog-hg')) return;
  const frage='Willst du eine Pause machen? Deine Runde bleibt gespeichert.';
  const d=document.createElement('div'); d.className='dialog-hg';
  d.innerHTML=`<div class="dialog blatt">${aku(frage,'troest')}<div class="aktionen"><button class="knopf gruen" id="dWeiter">▶ Weiterspielen</button><button class="knopf" id="dAbbr">⏸ Pause</button></div></div>`;
  app.appendChild(d); sag(frage);
  d.querySelector('#dWeiter').onclick=()=>{ d.remove(); };
  d.querySelector('#dAbbr').onclick=()=>{ const L=S.lauf, ziel=L&&L.kiste?'kiste':'insel';
    if(L){ if(L.uebung) S.lauf=null; else { S.laeufe=S.laeufe||{}; L.fb=null; S.laeufe[L.kiste?0:laufKey(L)]=L; S.lauf=null; } speichern(); }
    zeige(ziel); };
}

function starteAbenteuer(n){
  // angefangene Abenteuer bleiben gespeichert, auch wenn das Kind zwischendurch ein anderes spielt
  S.laeufe = S.laeufe || {};
  if(S.lauf && (S.lauf.a!==n || (S.lauf.ins||'tier')!==INSEL.id || S.lauf.uebung)){ if(S.lauf.uebung) S.lauf=null; else { S.laeufe[S.lauf.kiste?0:laufKey(S.lauf)]=S.lauf; S.lauf=null; } }
  if(!S.lauf && S.laeufe[abKey(n)]){ S.lauf=S.laeufe[abKey(n)]; delete S.laeufe[abKey(n)]; }
  if(!S.lauf) neueRunde(n);
  const L=S.lauf;
  // falls zuletzt mitten in einer Rückmeldung geschlossen
  if(L.aufgaben[L.i] && L.aufgaben[L.i].fertig) L.i++;
  if(L.i>=L.aufgaben.length){ return rundeFertig(); }
  speichern();
  L.fb=null; L.ansage = (L.r===1 && L.i===0) ? ((L.ins==='donner' && L.a===4) ? 'Jetzt kommen Sätze! Am Anfang gross, am Schluss ein Punkt.' : TEXTE.losGehts) : '';
  zeige('spiel'); vorlesenAufgabe(true);
}
function neueRunde(n){
  const a=abStand(n), h=heute();
  const r=a.runden+1;
  const wiederholung=a.erfuellt;
  if(r===1){ a.saetze=[]; a.punkte={richtig:0,gesamt:0}; }
  const aufgaben=baueRunde(S,n,r,h,wiederholung,a.saetze);
  aufgaben.forEach(t=>a.saetze.push(t.sid));
  S.lauf={a:n, ins:INSEL.id, r, aufgaben, i:0, muenzen:0, normal:0, fb:null};
  speichern();
}
function vorlesenAufgabe(mitAnsage, knopf){
  const L=S.lauf, t=L.aufgaben[L.i], s=SATZ[t.sid];
  const teile=[];
  if(mitAnsage && L.ansage) teile.push(L.ansage);
  teile.push(vorleseText(t, s, knopf));
  sag(...teile);
}

/* ---- Spiel ---- */
function satzHTML(s, wi, inhalt){
  let w=0, out='';
  s.tokens.forEach((t,k)=>{
    const p=ZEICHEN.test(t);
    if(k>0 && !p) out+=' ';
    if(p){ out+=esc(t); return; }
    out += (w===wi) ? inhalt : esc(t);
    w++;
  });
  return out;
}
function spiel(){
  const L=S.lauf, t=L.aufgaben[L.i], s=SATZ[t.sid], E=S.einst;
  // Punkte nur für die festen Aufgaben: eine eingeschobene Wiederholung macht die Runde nicht sichtbar länger
  const fest = L.aufgaben.map((x,k)=>({x,k})).filter(o=>!o.x.nach);
  const naechste = fest.findIndex(o=>o.k>=L.i);
  const punkte = fest.map((o,n)=>{ const k=o.k; const ok = k<L.i || (k===L.i && L.fb);
    const jetzt = (k===L.i && !L.fb) || (t.nach && !L.fb && n===naechste); return `<span class="punkt ${ok?'ok':''} ${jetzt?'jetzt':''}"></span>`; }).join('');
  let mitte, knoepfe, blase, stimmung='sprich', erkl='';
  const satzForm = formVon(t)==='satz';
  if(!L.fb){
    blase = L.ansage||'';
    const attr = `autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" data-gramm="false" enterkeyhint="done" name="x${Date.now()}"`;
    mitte = satzForm
      ? `${s.hinweis?`<div class="mitte einzahl">${esc(s.hinweis)} <span>→ viele:</span></div>`:''}<div class="mitte" style="color:var(--tinte);font-size:22px;font-weight:700">${s.hinweis?'Schreib die Mehrzahl.':s.klein?'Schreib die Wörter.':'Schreib den ganzen Satz.'}</div>${stricheHilfe(L) ? `<div class="linien" aria-label="${s.words.length} Wörter">${s.words.map((w,k)=>`<input class="wl" data-k="${k}" ${attr}>`).join('')}${s.ende?`<input class="wl wz" data-k="${s.words.length}" maxlength="1" aria-label="Satzzeichen" ${attr}>`:''}</div>` : `<textarea id="eing" class="ganzsatz" rows="2" ${attr}></textarea>`}`
      : `<div class="satz">${satzHTML(s, t.wi, `<input id="eing" class="luecke" style="width:calc(${Math.max(3,s.words[t.wi].length)+1}ch + 24px)" ${attr}>`)}</div>`;
    knoepfe = `<button class="knopf" id="hoeren">🔊 ${E.vorlesen==='knopf'?'Vorlesen':'Nochmals hören'}</button><button class="knopf gruen" id="fertig" disabled>Fertig ✓</button>`;
  } else {
    blase = L.fb.text; stimmung = L.fb.ok ? 'jubel' : 'troest';
    mitte = L.fb.html; erkl = L.fb.erkl ? `<div class="erklaer">💡 ${esc(L.fb.erkl)}</div>` : '';
    knoepfe = `<button class="knopf" id="hoeren">🔊 Nochmals hören</button><button class="knopf gold" id="weiter">Weiter ➜</button>`;
  }
  app.innerHTML = `${kopf(L.kiste?'🧰 Schatzkisten-Runde':esc(ABENTEUER[L.a-1]), '#zurueck')}
   <div class="spiel">
     <div class="punkte">${L.kiste?'<span class="mal">×2 🪙</span>':L.uebung?`Runde ${L.r} üben`:`Runde ${L.r} von 4`} &nbsp; ${punkte}</div>
     <div class="blatt spielblatt">
       <div class="aku-zeile">${aku(blase, stimmung)}<div class="bildzone">${satzForm ? (s.bild||'') : (BILD[s.words[t.wi]]||'')}</div></div>
       ${mitte}
       ${erkl}
       <div class="aktionen">${knoepfe}</div>
     </div>
   </div>`;
  document.getElementById('zurueck').onclick=abbruchFrage;
  document.getElementById('hoeren').onclick=()=> L.fb ? sag(satzZumVorlesen(s, formVon(t))) : vorlesenAufgabe(false, true);
  if(!L.fb){
    const ok=document.getElementById('fertig'), linien=[...app.querySelectorAll('.wl')];
    if(linien.length){ bindeLinien(linien, ok); return; }
    const ein=document.getElementById('eing');
    ein.oninput=()=>{ ok.disabled = !ein.value.trim(); };
    ein.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); if(ein.value.trim()) abgeben(ein.value); } };
    ok.onclick=()=>abgeben(ein.value);
    setTimeout(()=>{ try{ ein.focus({preventScroll:true}); }catch(e){} },50);
  } else {
    const w=document.getElementById('weiter'); w.onclick=weiter; setTimeout(()=>{ try{w.focus();}catch(e){} },50);
  }
}

/* Ganzer Satz auf Strichen: ein Feld pro Wort, Leerschlag springt zum nächsten Strich, ⌫ im leeren Feld zurück */
function stricheHilfe(L){
  return (S.einst.striche||'immer')!=='aus';   // Kokosbucht und Donnerfels: auf Strichen schreiben (Eltern können ausschalten)
}
function bindeLinien(linien, ok){
  const breite=f=>{ f.style.width = `calc(${Math.max(f.classList.contains('wz')?1:5, f.value.length+1)}ch + 16px)`; };
  const wert=()=>{ const z=linien.filter(f=>f.classList.contains('wz')).map(f=>f.value.trim()).join('');
    return linien.filter(f=>!f.classList.contains('wz')).map(f=>f.value.trim()).filter(Boolean).join(' ') + z; };
  const pruef=()=>{ ok.disabled = !wert().trim(); };
  linien.forEach((f,k)=>{
    breite(f);
    f.oninput=()=>{
      if(!f.classList.contains('wz') && /\s/.test(f.value)){
        const [vor, ...rest]=f.value.split(/\s+/); f.value=vor; breite(f);
        const n=linien[k+1]; if(n){ if(rest.join(' ')) n.value=rest.join(' ')+n.value; breite(n); try{ n.focus(); }catch(e){} }
      }
      breite(f); pruef();

    f.onkeydown=e=>{
      if(e.key==='Enter'){ e.preventDefault(); if(wert().trim()) abgeben(wert()); }
      else if(e.key==='Backspace' && !f.value && k>0){ e.preventDefault(); const v=linien[k-1]; try{ v.focus(); v.setSelectionRange(v.value.length,v.value.length); }catch(x){} }
    };
  });
  ok.onclick=()=>abgeben(wert());
  pruef();
  setTimeout(()=>{ try{ linien[0].focus({preventScroll:true}); }catch(e){} },50);
}

      const markiert = (()=>{ let w=0,out=''; s.tokens.forEach((tk,k)=>{ const p=ZEICHEN.test(tk); if(k>0&&!p) out+=' ';
          if(p){ out+= v.endeOk||k<s.tokens.length-1 ? esc(tk) : `<span class="gruenb">${esc(tk)}</span>`; return; }
          const vw=v.woerter[w]; out += vw.art==='richtig' ? esc(tk) : vw.art==='fehlt' ? `<span class="gruenb">${esc(tk)}</span>` : rotHTML(vw.ist, tk).soll; w++; }); return out; })();
      html=`<div class="dein" style="font-size:30px"><span class="falsch">${dein}</span></div><div class="satz">${markiert}</div>`;
    }
  }
  if(L.kiste && geknackt.length) text+=' '+fuell(TEXTE.wortSicher,{wort:geknackt[0]});
  t.fertig=true; t.ok=ok;
  L.richtig=(L.richtig||0)+(ok?1:0); L.gesamt=(L.gesamt||0)+1;
  if(geknackt.length) L.geknackt=(L.geknackt||[]).concat(geknackt);
  if(a){ a.punkte = a.punkte || {richtig:0,gesamt:0}; a.punkte.gesamt++; if(ok) a.punkte.richtig++; }
  if(!t.schatz && !t.wdh && !L.kiste){ L.normal++; if(L.normal===5) text+=' '+TEXTE.halbeRunde; }
  S.versuche.push({z:new Date().toISOString(), tag:h, sid:s.id, form, schatz:t.schatz, wdh:!!t.wdh, kiste:!!L.kiste, eingabe, erg: form==='satz' ? {w:ergebnis.woerter.map(w=>w.art), ende:ergebnis.endeOk, zuviel:ergebnis.zuviel.length} : ergebnis.art});
  if(S.versuche.length>3000) S.versuche=S.versuche.slice(-3000);
  L.fb={text, html, ok, erkl};
  speichern();
  render();
  if(ok){ jubelTon(); sag(text); } else sag(text, erkl);
}
function kisteRundenHeute(){ return (S.kisteTag && S.kisteTag.d===heute()) ? S.kisteTag.n : 0; }
function kisteAngefangen(){ return !!((S.lauf && S.lauf.kiste) || (S.laeufe && S.laeufe[0])); }
function kisteSpielbar(){ return kisteAngefangen() || (Object.values(S.kiste).some(k=>k.status==='kiste') && kisteRundenHeute()<KISTE_PRO_TAG); }
/* Schatzkisten-Runde starten oder fortsetzen */
function starteKiste(){
  S.laeufe = S.laeufe || {};
  if(S.lauf && !S.lauf.kiste){ if(S.lauf.uebung) S.lauf=null; else { S.laeufe[laufKey(S.lauf)]=S.lauf; S.lauf=null; } }
  if(!S.lauf && S.laeufe[0]){ S.lauf=S.laeufe[0]; delete S.laeufe[0]; }
  if(!S.lauf){
    if(kisteRundenHeute()>=KISTE_PRO_TAG) return zeige('kiste');
    const aufgaben=baueKisteRunde(S, heute());
    if(!aufgaben.length) return zeige('kiste');
    S.kisteTag={d:heute(), n:kisteRundenHeute()+1};
    S.lauf={a:0, kiste:true, r:1, aufgaben, i:0, normal:0, richtig:0, gesamt:0, fb:null};
  }
  const L=S.lauf;
  if(L.aufgaben[L.i] && L.aufgaben[L.i].fertig) L.i++;
  if(L.i>=L.aufgaben.length) return rundeFertig();
  speichern();
  L.fb=null; L.ansage = L.i===0 ? TEXTE.kisteRunde : '';
  zeige('spiel'); vorlesenAufgabe(true);
}
function weiter(){
  const L=S.lauf; L.fb=null; L.ansage=''; L.i++; speichern();
  if(L.i>=L.aufgaben.length) return rundeFertig();
  render(); vorlesenAufgabe(false);
}
/* Nach jeder Runde gibt es Münzen; am Ende des Abenteuers zusätzlich den Abenteuer-Bonus und einen Schatz */
function rundeFertig(){
  const L=S.lauf; S.lauf=null;
  const E=S.einst, gek=L.geknackt||[], bonus=gek.length*E.mzGeknackt;
  let mz=muenzenRunde(L.richtig||0, L.gesamt||0);
  if(L.kiste){
    const faktor = (L.gesamt && L.richtig===L.gesamt) ? KISTE_FAKTOR_TOP : KISTE_FAKTOR;
    mz*=faktor; speichern();
    zeige('rundeEnde',{kiste:true, mz, faktor, bonus, geknackt:gek, richtig:L.richtig||0, gesamt:L.gesamt||0});
    plusMuenzen(mz+bonus); speichern();
    sag(fuell(TEXTE.kisteRundeEnde,{muenzen:mz+bonus}));
    return;
  }
  const bonusSagen = gek.map(w=>fuell(TEXTE.geknacktBonus,{wort:w,muenzen:E.mzGeknackt}));
  if(L.uebung){
    mz=Math.ceil(mz*E.wiederholProzent/100); speichern();
    zeige('rundeEnde',{uebung:true, n:L.a, r:L.r, mz, bonus, geknackt:gek});
    plusMuenzen(mz+bonus); speichern();
    sag(fuell(TEXTE.rundeMuenzen,{muenzen:mz}), ...bonusSagen);
    return;
  }
  const a=abStand(L.a, L.ins||'tier'), n=L.a, wiederholt=a.erfuellt;
  if(wiederholt) mz=Math.ceil(mz*E.wiederholProzent/100);
  a.runden=L.r;
  if(a.runden>=4){
    const p=a.punkte||{richtig:0,gesamt:0};
    const total = mz+bonus;   // Münzen gibt es pro Runde; am Ende des Abenteuers geht es in den Piratenladen
    a.runden=0; a.durchgaenge++; a.erfuellt=true;
    a.ergebnisse = a.ergebnisse || []; a.ergebnisse.push({tag:heute(), richtig:p.richtig, gesamt:p.gesamt, muenzen:total});
    speichern();
    const ins=L.ins||'tier';
    if(inselSchatzFaellig()===ins){   // letztes Abenteuer der Insel: zuerst die Truhe mit dem X öffnen
      plusMuenzen(total); inselSchatzGeben(ins);
      zeige('inselSchatz',{id:ins});
      sag(TEXTE.abenteuerErfuellt, fuell(TEXTE.rundeMuenzenKurz,{muenzen:mz}), ...bonusSagen, inselSchatzText(ins,false));
      return;
    }
    zeige('laden',{fertig:{n, mz:total, richtig:p.richtig, gesamt:p.gesamt}});
    plusMuenzen(total); speichern();
    sag(TEXTE.abenteuerErfuellt, fuell(TEXTE.rundeMuenzenKurz,{muenzen:mz}), ...bonusSagen, 'Jetzt darfst du im Piratenladen einkaufen!');
    return;
  }
  speichern(); zeige('rundeEnde',{n, mz, bonus, geknackt:gek});
  plusMuenzen(mz+bonus); speichern();
  sag(fuell(TEXTE.rundeMuenzen,{muenzen:mz}), ...bonusSagen);
}
function rundeEnde(){
  const p=parm, gek=p.geknackt||[];
  const bonusHTML = gek.length ? `<p class="mzzeile">🔓 ${gek.map(esc).join(', ')} &nbsp; +${p.bonus} 🪙</p>` : '';
  if(p.kiste){

    document.getElementById('nochmal').onclick=()=>starteUebung(p.n, p.r);
    return;
  }
  const a=abStand(p.n);
  const sterne = [1,2,3,4].map(k=> k<=a.runden ? '⭐' : '☆').join(' ');
  app.innerHTML=`${kopf(esc(ABENTEUER[p.n-1]),'insel')}
   <div class="blatt mitte" style="margin-top:20px">${aku(fuell(TEXTE.rundeMuenzen,{muenzen:p.mz}),'jubel')}
    <div style="font-size:64px;letter-spacing:6px">${sterne}</div>
    <p class="mzzeile">+${p.mz} 🪙</p>${bonusHTML}
    <p style="font-size:22px">Runde ${a.runden} von 4 geschafft.</p></div>
   <div class="aktionen"><button class="knopf" data-go="insel">🌴 Zur Insel</button><button class="knopf gruen" id="nochmal">Nächste Runde ➜</button></div>`;
  document.getElementById('nochmal').onclick=()=>starteAbenteuer(p.n);
}

/* Besuch: Einstellungen pro Kind (Eltern-Ansicht) */
function besuchEinst(id){ const d=BESUCH.find(x=>x.id===id); const e=((S.einst||{}).besuch||{})[id]||{}; return {name:(e.name||'').trim()||d.name, an:e.an!==false}; }
function besuchDa(){ return (S.besuch||[]).map(id=>BESUCH.find(x=>x.id===id)).filter(Boolean).map(b=>Object.assign({},b,{name:besuchEinst(b.id).name})); }
function besuchSpruch(id){ const b=BESUCH.find(x=>x.id===id); return fuell(zufall(b.sprueche),{name:besuchEinst(id).name, anrede:anrede(S.figur)}); }
function besuchKaufen(id){
  const b=BESUCH.find(x=>x.id===id); if(!b || (S.besuch||[]).includes(id) || S.muenzen<b.preis) return false;
  S.muenzen-=b.preis; S.besuch=(S.besuch||[]).concat(id);
  S.inventar.push({name:'Besuch: '+besuchEinst(id).name, bild:'🎟️', herkunft:'Piratenladen', preis:b.preis, am:heute(), besuch:true});
  speichern(); return true;
}

function elternPin(){

  app.innerHTML=`${kopf('Eltern','karte')}<div class="blatt eltern setup" style="max-width:420px">
    <h2>🔒 Eltern-Ansicht</h2>${S.pin?'<label>Eltern-PIN</label>':'<p>Bitte eine Eltern-PIN festlegen (4 Ziffern). Sie schützt nur diesen Bereich.</p><label>Neue Eltern-PIN</label>'}<input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off">

/* =========================================================================
   SERVER (Supabase, Zürich) – Tablet koppeln, Stand speichern und laden
   Das Tablet hat eine eigene, anonyme Geräte-Anmeldung. Gekoppelt wird es einmal
   von den Eltern (E-Mail-Login) über einen Einmal-Code. Der Spielstand wird ohne
   die Versuchsliste als Ganzes gespeichert; jede Eingabe einzeln in «versuch».
   ========================================================================= */
/* Live-Version (Kinder) nur unter der festen Adresse; jede andere Adresse (Test-Zweig, Vorschau, lokal)
   nutzt den getrennten Test-Server, damit Tests nie echte Spielstände berühren. */
const LIVE_HOST='rechtschreib-piraten-app.netlify.app';
const IST_TEST = location.hostname !== LIVE_HOST;
const SB_URL = IST_TEST ? 'https://tpvczkgakjcripyqdtri.supabase.co' : 'https://ealhzqyaanftiuynwmbi.supabase.co';
const SB_KEY = IST_TEST ? 'sb_publishable_tN1btK5Es_u9CAWgMyOt_w_3s4kImk7' : 'sb_publishable_WtDXVst3oi1zO9IVB8wsZA_tbNed6D0';
const SVKEY='akubine_server_v1';
let SV=(()=>{ try{ return JSON.parse(localStorage.getItem(SVKEY))||null; }catch(e){ return null; } })();
function svSpeichern(){ try{ if(SV) localStorage.setItem(SVKEY, JSON.stringify(SV)); else localStorage.removeItem(SVKEY); }catch(e){} }
function verbunden(){ return !!(SV && SV.kind_id && SV.sess); }

const SB_FEHLER={ invalid_credentials:'E-Mail oder Passwort stimmt nicht.', email_not_confirmed:'Bitte zuerst die E-Mail bestätigen (Link in der E-Mail von Supabase).',
  user_already_exists:'Für diese E-Mail gibt es schon ein Konto. Bitte anmelden.', weak_password:'Das Passwort ist zu kurz (mindestens 6 Zeichen).',
  over_email_send_rate_limit:'Zu viele E-Mails in kurzer Zeit. Bitte später nochmals versuchen.', anonymous_provider_disabled:'Anonyme Anmeldung ist bei Supabase ausgeschaltet.',
  email_address_invalid:'Diese E-Mail-Adresse ist ungültig.', validation_failed:'Bitte E-Mail und Passwort prüfen.' };
async function sbFetch(pfad, opt, sess){
  opt=opt||{};
  const h={apikey:SB_KEY,'Content-Type':'application/json'};
  if(sess) h.Authorization='Bearer '+sess.access_token;
  let r;
  try{ r=await fetch(SB_URL+pfad,{method:opt.method||'GET',headers:Object.assign(h,opt.headers||{}),body:opt.body!==undefined?JSON.stringify(opt.body):undefined}); }
  catch(e){ const f=new Error('Keine Verbindung zum Server. Ist das Tablet online?'); f.offline=true; throw f; }
  const t=await r.text(); let d=null; try{ d=t?JSON.parse(t):null; }catch(e){ d=t; }
  if(!r.ok){ const code=d&&(d.error_code||d.code); const m=SB_FEHLER[code]||(d&&(d.message||d.msg||d.error_description||d.error))||('Fehler '+r.status);
    const f=new Error(m); f.status=r.status; f.code=code; throw f; }
  return d;
}
function sessAus(d){ return {access_token:d.access_token, refresh_token:d.refresh_token, expires_at:d.expires_at||(Math.floor(Date.now()/1000)+(d.expires_in||3600)), user_id:d.user&&d.user.id}; }
const rpc=(fn,args,sess)=>sbFetch('/rest/v1/rpc/'+fn,{method:'POST',body:args},sess);
let erneuern=null;
async function geraetSess(){
  const s=SV.sess;
  if(s.expires_at-90 > Date.now()/1000) return s;
  if(!erneuern) erneuern=sbFetch('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:s.refresh_token}})
    .then(d=>{ SV.sess=sessAus(d); svSpeichern(); return SV.sess; })
    .catch(e=>{ if(e.status===400||e.status===401){ SV.fehler='Die Anmeldung des Tablets ist abgelaufen. Bitte in der Eltern-Ansicht neu verbinden.'; SV.getrennt=true; svSpeichern(); } throw e; })
    .finally(()=>{ erneuern=null; });
  return erneuern;
}
function standFuerServer(){ const o=Object.assign({},S); delete o.versuche; return o; }

let syncTimer=null, syncLaeuft=false, syncNochmal=false;
function syncPlanen(ms){ if(!verbunden()||SV.getrennt) return; clearTimeout(syncTimer); syncTimer=setTimeout(syncJetzt, ms==null?4000:ms); }
async function syncJetzt(){
  if(!verbunden()||SV.getrennt||!S) return;
  if(syncLaeuft){ syncNochmal=true; return; }
  syncLaeuft=true; clearTimeout(syncTimer);
  try{
    const sess=await geraetSess();
    const neu=(S.versuche||[]).filter(v=>v && v.z>(SV.vz||''));
    for(let i=0;i<neu.length;i+=200){
      const teil=neu.slice(i,i+200);
      await sbFetch('/rest/v1/versuch',{method:'POST',headers:{Prefer:'return=minimal'},body:teil.map(v=>({kind_id:SV.kind_id, zeitpunkt:v.z, uebung:v.form||null, satz_id:v.sid||null, eingabe:v.eingabe==null?null:String(v.eingabe), auswertung:v}))},sess);
      SV.vz=teil[teil.length-1].z; svSpeichern();
    }
    if(SV.geaendert){
      SV.geaendert=false;
      const r=await rpc('stand_speichern',{p_kind_id:SV.kind_id, p_stand:standFuerServer(), p_basis_version:SV.version||0},sess);
      if(r && r.ok) SV.version=r.version;
      else { SV.version=r?r.version:SV.version; SV.geaendert=true; syncNochmal=true; }   // ein anderes Gerät hat gespeichert: dieses Tablet ist das Gerät des Kindes, sein Stand gilt
    }
    SV.letzt=new Date().toISOString(); SV.fehler=null; svSpeichern();
  }catch(e){
    if(SV){ SV.geaendert = SV.geaendert || true; if(!SV.getrennt) SV.fehler=e.message; svSpeichern(); }
    clearTimeout(syncTimer); if(!(SV&&SV.getrennt)) syncTimer=setTimeout(syncJetzt, 60000);
  }finally{
    syncLaeuft=false;
    if(syncNochmal){ syncNochmal=false; syncPlanen(800); }
  }
}
async function versucheVomServer(kid, sess){
  const alle=[];
  for(let off=0; off<3000; off+=1000){
    const rows=await sbFetch(`/rest/v1/versuch?select=auswertung&kind_id=eq.${kid}&order=zeitpunkt.desc&limit=1000&offset=${off}`,{},sess);
    rows.forEach(r=>{ if(r.auswertung) alle.push(r.auswertung); });
    if(rows.length<1000) break;
  }
  return alle.reverse();
}
function standUebernehmen(stand, versuche){
  const o=Object.assign({}, stand); o.versuche=versuche||[]; o.reset=RESET_STAND;
  S=migrieren(o);
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  setInsel((S.lauf && !S.lauf.kiste && S.lauf.ins) || S.aktInsel || 'tier');
  [S.lauf, ...Object.values(S.laeufe||{})].forEach(L=>{ if(L && L.aufgaben) formenSetzen(S, L.aufgaben); });
}
/* Beim Öffnen: Ist auf dem Server ein neuerer Stand (z. B. nach Gerätewechsel), wird er übernommen. */
async function startAbgleich(){
  if(!verbunden()||SV.getrennt) return;
  try{
    const sess=await geraetSess();
    const rows=await sbFetch(`/rest/v1/kind?select=name,stand,stand_version&id=eq.${SV.kind_id}`,{},sess);
    if(!rows.length){ SV.getrennt=true; SV.fehler='Dieses Tablet ist nicht mehr mit einem Kind verbunden. Bitte in der Eltern-Ansicht neu verbinden.'; svSpeichern(); return; }
    const k=rows[0];
    if(k.stand && k.stand_version>(SV.version||0) && (k.stand._t||0)>((S&&S._t)||0) && !SV.geaendert){
      const spielt = ansicht==='spiel';
      standUebernehmen(k.stand, S?S.versuche:[]); SV.version=k.stand_version; svSpeichern();
      if(!spielt) render();
    } else if(k.stand_version!==(SV.version||0)){ SV.version=k.stand_version; SV.geaendert=true; svSpeichern(); }
  }catch(e){}
  syncPlanen(1500);
}
window.addEventListener('online', ()=>syncPlanen(500));
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden' && verbunden() && (SV.geaendert || (S && (S.versuche||[]).some(v=>v.z>(SV.vz||''))))) syncJetzt(); });

function zeitText(iso){ if(!iso) return '–'; const d=new Date(iso); return d.toLocaleDateString('de-CH')+' '+d.toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'}); }
function serverBlockHTML(){
  if(!verbunden()) return `<div class="hinweis">Dieses Tablet ist noch nicht mit dem Server verbunden. Der Fortschritt liegt nur auf diesem Tablet.</div>
    <button class="knopf gruen" data-go="verbinden">Mit dem Server verbinden</button>`;
  const offen=SV.geaendert || (S.versuche||[]).some(v=>v.z>(SV.vz||''));
  return `<p>✓ Verbunden mit dem Server als <b>${esc(SV.name||S.name)}</b> (Haushalt ${esc(SV.haushalt||'')}).<br>
    Zuletzt gespeichert: <b>${zeitText(SV.letzt)}</b>${offen?' · noch nicht alles übertragen':''}</p>
    ${SV.fehler?`<div class="hinweis">⚠️ ${esc(SV.fehler)}</div>`:''}
    <div class="zeile"><button class="knopf" id="svjetzt">Jetzt speichern</button>${SV.getrennt?'<button class="knopf gruen" data-go="verbinden">Neu verbinden</button>':''}
    <button class="knopf" id="svtrenn1">Verbindung trennen …</button><span id="svinfo"></span></div>
    <span id="svtrenn2" style="display:none">Das Tablet speichert dann nur noch für sich. Der Stand auf dem Server bleibt erhalten. <button class="knopf rot" id="svtrennJa">Trennen</button> <button class="knopf" id="svtrennNein">Abbrechen</button></span>`;
}
function serverBlockBinden($){
  if(!verbunden()) return;
  $('svjetzt').onclick=async()=>{ $('svinfo').textContent=' …'; SV.geaendert=true; await syncJetzt(); render(); };
  $('svtrenn1').onclick=()=>{ $('svtrenn2').style.display='inline'; };
  $('svtrennNein').onclick=()=>{ $('svtrenn2').style.display='none'; };
  $('svtrennJa').onclick=()=>{ SV=null; svSpeichern(); render(); };
}

/* ---- Verbinden (Eltern) ---- */
let VB=null;   // {schritt, eltern, haushalt, kinder, meldung, wahl}
function vbKopf(){ const ohne = VB.erst && (VB.schritt==='login'||VB.schritt==='laeuft'||VB.schritt==='fertig');
  return `<header class="kopf">${ohne?'<div></div>':'<button class="zur" id="vbzur">⬅</button>'}<div class="titel">${VB.erst?'Einrichten':'Mit dem Server verbinden'}</div><div></div></header>`; }
const SPAETER='akubine_server_spaeter';
function spaeterMerken(){ try{ localStorage.setItem(SPAETER,'1'); }catch(e){} }
function vbAbmelden(){ if(VB && VB.eltern){ const s=VB.eltern; sbFetch('/auth/v1/logout',{method:'POST'},s).catch(()=>{}); } VB=null; }
async function vbKinderLaden(){
  const hh=await sbFetch('/rest/v1/haushalt?select=id,name,einstellungen',{},VB.eltern);
  if(!hh.length){ VB.schritt='haushalt'; return; }
  VB.haushalt=hh[0];
  VB.kinder=await sbFetch(`/rest/v1/kind?select=id,name,stand_version,aktualisiert_am,muenzen:stand->muenzen&haushalt_id=eq.${hh[0].id}&order=erstellt_am`,{},VB.eltern);
  VB.schritt='kinder';
}
function verbinden(){
  if(!VB) VB={schritt:'login'};
  const m=VB.meldung?`<div class="hinweis">${esc(VB.meldung)}</div>`:'';
  let inhalt='';
  if(VB.schritt==='login') inhalt=`${VB.erst?'<h2>🏴‍☠️ Willkommen bei den Wortschatz-Piraten!</h2>'
      :'<h2>🔑 Eltern-Anmeldung</h2><p>Einmal pro Tablet: Ein Elternteil meldet sich an und wählt, zu welchem Kind dieses Tablet gehört. Danach speichert das Tablet den Fortschritt automatisch – das Kind merkt davon nichts.</p>'}
    <label>E-Mail</label><input id="vbmail" type="email" autocomplete="username" autocapitalize="off" spellcheck="false" value="${esc(VB.mail||'')}">
    <label>Passwort</label><input id="vbpw" type="password" autocomplete="current-password" value="${esc(VB.pw||'')}">
    ${m}<div class="zeile"><button class="knopf gruen" id="vblogin">Anmelden</button><button class="knopf" id="vbneu">Konto eröffnen</button></div>
    <p style="font-size:15px">Noch kein Konto? E-Mail und ein neues Passwort (mindestens 6 Zeichen) eingeben und «Konto eröffnen» tippen.</p>
    ${VB.erst?`<p style="margin-top:18px;font-size:15px"><a href="#" id="vbohne">${S?'Später verbinden':'Ohne Anmeldung ausprobieren (Fortschritt nur auf diesem Tablet)'}</a></p>`:''}`;
  else if(VB.schritt==='haushalt') inhalt=`<h2>🏠 Haushalt anlegen</h2>
    <p>Zu diesem Konto gibt es noch keinen Haushalt.</p>
    <label>Name des Haushalts (z. B. Familie Muster)</label><input id="vbhh" maxlength="60" autocomplete="off" value="${esc(VB.hhName||'')}">
    <label>Eltern-PIN (4 Ziffern)</label><input id="vbpin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" style="max-width:200px">
    <p style="font-size:15px;margin-top:-6px">Die PIN schützt die Eltern-Ansicht auf allen Tablets eurer Kinder. Die Kinder sollten sie nicht kennen.</p>
    ${m}<button class="knopf gruen" id="vbhhok">Haushalt anlegen</button>
    <h3>Oder: Einladung vom anderen Elternteil</h3>
    <label>Code</label><input id="vbcode" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <button class="knopf" id="vbcodeok">Code einlösen</button>`;
  else if(VB.schritt==='kinder') inhalt=`<h2>👧👦 Für welches Kind ist dieses Tablet?</h2>
    <p>Haushalt: <b>${esc(VB.haushalt.name)}</b></p>${m}
    <div class="wahl-liste" style="display:flex;flex-direction:column;gap:10px">
    ${VB.kinder.map(k=>`<button class="knopf" data-kind="${k.id}">${esc(k.name)} <small style="font-weight:400">${k.stand_version?`· auf dem Server: ${k.muenzen||0} Münzen, zuletzt ${zeitText(k.aktualisiert_am)}`:'· noch kein Fortschritt auf dem Server'}</small></button>`).join('')}
    </div>
    <h3>${VB.kinder.length?'Oder neues Kind':'Kind eintragen'}</h3>
    <div class="zeile"><input id="vbkind" maxlength="20" autocomplete="off" value="${S?esc(S.name):''}" placeholder="Vorname oder Spitzname" style="max-width:300px;margin:0"><button class="knopf gruen" id="vbkindok">Anlegen und verbinden</button></div>
    <h3>Zweiter Elternteil</h3>
    <div class="zeile"><button class="knopf" id="vbeinl">Einladungscode erstellen</button><span id="vbeinlcode"></span></div>`;
  else if(VB.schritt==='wahl'){ const k=VB.wahl;
    inhalt=`<h2>Welcher Fortschritt soll gelten?</h2>
    <p>Für <b>${esc(k.name)}</b> gibt es schon einen Fortschritt auf dem Server, und auf diesem Tablet wird auch schon gespielt.</p>
    <div class="wahl-liste" style="display:flex;flex-direction:column;gap:10px">
    <button class="knopf" id="vbserver">☁️ Vom Server: ${k.muenzen||0} Münzen, zuletzt ${zeitText(k.aktualisiert_am)}</button>
    <button class="knopf" id="vbtablet">📱 Von diesem Tablet: ${esc(S.name)}, ${S.muenzen} Münzen</button></div>
    <p><small>Der andere Stand wird überschrieben.</small></p>${m}`; }
  else if(VB.schritt==='laeuft') inhalt=`<h2>⏳ Einen Moment …</h2>${m}`;
  else if(VB.schritt==='fertig') inhalt=`<h2>✓ Verbunden</h2><p>Dieses Tablet gehört jetzt zu <b>${esc(SV.name)}</b>. Der Fortschritt wird ab jetzt automatisch auf dem Server gespeichert.</p>
    <button class="knopf gruen" id="vbfertig">Fertig</button>`;
  app.innerHTML=`${vbKopf()}<div class="blatt eltern setup" style="max-width:640px;margin:10px auto">${inhalt}</div>`;
  const $=id=>document.getElementById(id);
  const zurueck=()=>{ if(VB.erst){ vbAbmelden(); VB={schritt:'login',erst:true}; return render(); } vbAbmelden(); if(!S) zeige('karte'); else zeige(elternOk?'eltern':'karte'); };
  if($('vbzur')) $('vbzur').onclick=zurueck;
  const fehler=e=>{ VB.meldung=e.message; if(VB.schritt==='laeuft') VB.schritt=VB.vorher||'login'; render(); };
  const schritt=async(fn)=>{ VB.vorher=VB.schritt; VB.meldung=''; VB.schritt='laeuft'; render(); try{ await fn(); }catch(e){ return fehler(e); } render(); };
  if(VB.schritt==='login'){
    const daten=()=>{ VB.mail=$('vbmail').value.trim(); VB.pw=$('vbpw').value; return {email:VB.mail, password:VB.pw}; };
    if($('vbohne')) $('vbohne').onclick=e=>{ e.preventDefault(); spaeterMerken(); VB=null; zeige(S?'karte':'setup'); };
    $('vblogin').onclick=()=>{ const d=daten(); if(!d.email||!d.password){ VB.meldung='Bitte E-Mail und Passwort eingeben.'; return render(); }
      schritt(async()=>{ VB.eltern=sessAus(await sbFetch('/auth/v1/token?grant_type=password',{method:'POST',body:d})); VB.pw=''; await vbKinderLaden(); }); };
    $('vbneu').onclick=()=>{ const d=daten(); if(!d.email||!d.password){ VB.meldung='Bitte E-Mail und ein neues Passwort (mindestens 6 Zeichen) eingeben, dann nochmals «Konto eröffnen» tippen.'; return render(); }
      schritt(async()=>{ const r=await sbFetch('/auth/v1/signup?redirect_to='+encodeURIComponent(location.origin+location.pathname),{method:'POST',body:d});
        if(r && r.access_token){ VB.eltern=sessAus(r); VB.pw=''; await vbKinderLaden(); }
        else { VB.schritt='login'; VB.meldung='Fast geschafft! Wir haben eine E-Mail an '+d.email+' geschickt. Bitte darin auf den Bestätigungslink tippen, dann hierher zurückkommen und «Anmelden» tippen.'; } }); };
  }
  if(VB.schritt==='haushalt'){
    $('vbhhok').onclick=()=>{ const n=$('vbhh').value.trim(), pin=$('vbpin').value.trim(); VB.hhName=n;
      if(!n){ VB.meldung='Bitte einen Namen eingeben.'; return render(); }
      if(!/^\d{4}$/.test(pin)){ VB.meldung='Bitte eine Eltern-PIN mit 4 Ziffern eingeben.'; return render(); }
      schritt(async()=>{ const da=await sbFetch('/rest/v1/haushalt?select=id',{},VB.eltern);   // falls ein früherer Versuch halb geklappt hat
        const id = da.length ? da[0].id : await rpc('haushalt_anlegen',{p_name:n},VB.eltern);
        await sbFetch(`/rest/v1/haushalt?id=eq.${id}`,{method:'PATCH',headers:{Prefer:'return=minimal'},body:{name:n, einstellungen:{eltern_pin:pin}}},VB.eltern);
        await vbKinderLaden(); }); };
    $('vbcodeok').onclick=()=>{ const c=$('vbcode').value.trim(); if(!c) return;
      schritt(async()=>{ await rpc('einladung_einloesen',{p_code:c},VB.eltern); await vbKinderLaden(); }); };
  }
  if(VB.schritt==='kinder'){
    app.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{ const k=VB.kinder.find(x=>x.id===b.dataset.kind);
      if(k.stand_version && S && S.versuche && S.versuche.length){ VB.wahl=k; VB.schritt='wahl'; VB.meldung=''; return render(); }
      schritt(()=>vbKoppeln(k, k.stand_version?'server':'tablet')); });
    $('vbkindok').onclick=()=>{ const n=$('vbkind').value.trim(); if(!n){ VB.meldung='Bitte einen Namen eingeben.'; return render(); }
      schritt(async()=>{ const r=await sbFetch('/rest/v1/kind',{method:'POST',headers:{Prefer:'return=representation'},body:{haushalt_id:VB.haushalt.id, name:n}},VB.eltern);
        await vbKoppeln(Object.assign({stand_version:0}, r[0]), 'tablet'); }); };
    $('vbeinl').onclick=async()=>{ try{ const c=await rpc('einladung_erstellen',{p_typ:'eltern'},VB.eltern);
      $('vbeinlcode').innerHTML=` Code: <b style="font-size:22px;letter-spacing:3px">${esc(c)}</b> – 30 Minuten gültig. Der andere Elternteil legt damit ein eigenes Konto an und wählt «Code einlösen».`; }catch(e){ $('vbeinlcode').textContent=' '+e.message; } };
  }
  if(VB.schritt==='wahl'){
    $('vbserver').onclick=()=>schritt(()=>vbKoppeln(VB.wahl,'server'));
    $('vbtablet').onclick=()=>schritt(()=>vbKoppeln(VB.wahl,'tablet'));
  }
  if(VB.schritt==='fertig') $('vbfertig').onclick=()=>{ VB=null; if(!S.figur||!S.figur.fertig) zeige('figur'); else zeige(elternOk?'eltern':'karte'); };
}
/* Tablet mit einem Kind koppeln. quelle: 'server' (Stand vom Server holen) oder 'tablet' (Stand dieses Tablets hochladen) */
async function vbKoppeln(k, quelle){
  const code=await rpc('einladung_erstellen',{p_typ:'geraet', p_kind_id:k.id},VB.eltern);
  const geraet = (SV && SV.sess && !SV.getrennt) ? await geraetSess().catch(()=>null) : null;
  const sess = geraet || sessAus(await sbFetch('/auth/v1/signup',{method:'POST',body:{data:{}}}));
  await rpc('einladung_einloesen',{p_code:code, p_bezeichnung:'Tablet von '+k.name},sess);
  const neu={kind_id:k.id, name:k.name, haushalt:VB.haushalt.name, sess, version:0, vz:'', geaendert:false};
  if(quelle==='server' && k.stand_version){
    const rows=await sbFetch(`/rest/v1/kind?select=stand,stand_version&id=eq.${k.id}`,{},sess);
    const versuche=await versucheVomServer(k.id, sess);
    standUebernehmen(rows[0].stand, versuche);
    neu.version=rows[0].stand_version; neu.vz=versuche.length?versuche[versuche.length-1].z:'';
  } else {
    if(!S){ S=neuerStand(k.name,''); S.reset=RESET_STAND; }
    neu.version=k.stand_version||0; neu.geaendert=true;
  }
  const hpin=((VB.haushalt||{}).einstellungen||{}).eltern_pin;
  if(hpin && /^\d{4}$/.test(hpin)) S.pin=hpin;   // Eltern-PIN des Haushalts gilt auf jedem Tablet
  SV=neu; svSpeichern();
  speichern();
  vbAbmelden(); VB={schritt:'fertig'};
  await syncJetzt();
}

S=laden();
if(location.hash && /access_token|error_description/.test(location.hash)) try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
if(S){ setInsel((S.lauf && !S.lauf.kiste && S.lauf.ins) || S.aktInsel || 'tier');
  [S.lauf, ...Object.values(S.laeufe||{})].forEach(L=>{ if(L && L.aufgaben) formenSetzen(S, L.aufgaben); }); }
window.__wp = {S:()=>S, SV:()=>SV, syncJetzt, SATZ, zeige, speichern, satzZumVorlesen, setEltern:v=>{elternOk=v;}};   /* nur für Tests */
{ let sp=false; try{ sp=localStorage.getItem(SPAETER)==='1'; }catch(e){}
  if(!verbunden() && !(S && sp)){ ansicht='verbinden'; VB={schritt:'login',erst:true}; } }
render();
startAbgleich();
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
